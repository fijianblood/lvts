name: Deploy Loma chat server

# Loma, the LvTS chat assistant (workers/loma), runs on Cloudflare Workers as
# "lvts-loma". This deploys it when its folder changes on main, using the same
# Cloudflare secrets as the neighbourhood server:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# The Claude key stays a secret on the Worker itself (ANTHROPIC_API_KEY); deploying
# new code keeps it.

on:
  push:
    branches: [main]
    paths:
      - 'workers/loma/**'
      - '.github/workflows/loma-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loma-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/loma
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets are set
        id: ready
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Loma not deployed: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repository's Actions secrets."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.ready.outputs.go == 'true'
      - name: Type-check
        if: steps.ready.outputs.go == 'true'
        run: npx tsc --noEmit
      - name: Test
        if: steps.ready.outputs.go == 'true'
        run: npm test
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        run: npx wrangler deploy
      - name: Check it answers the website
        if: steps.ready.outputs.go == 'true'
        working-directory: .
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS https://lvts-loma.lomavatatechfiji.workers.dev/ -H 'Origin: https://fijianblood.github.io')
          echo "Loma answered OPTIONS with $status"
          test "$status" = "204"
