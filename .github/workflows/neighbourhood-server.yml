name: Deploy neighbourhood server

# The LvTS Neighbourhood server (workers/neighbourhood) keeps the characters
# visitors make for the House Hunt. It runs on Cloudflare Workers (free plan).
# Until the Cloudflare secrets below are added, this workflow does nothing.
#
# Settings -> Secrets and variables -> Actions -> New repository secret:
#   CLOUDFLARE_API_TOKEN        an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID       your Cloudflare account ID
#   NEIGHBOURHOOD_ADMIN_TOKEN   a long random password for approving characters (16+ characters)

on:
  push:
    branches: [main]
    paths:
      - 'workers/neighbourhood/**'
      - '.github/workflows/neighbourhood-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neighbourhood-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/neighbourhood
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.NEIGHBOURHOOD_ADMIN_TOKEN }}
    steps:
      - name: Check the Cloudflare secrets are set
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "::notice::Neighbourhood server not deployed: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and NEIGHBOURHOOD_ADMIN_TOKEN in the repository's Actions secrets."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ ${#ADMIN_TOKEN} -lt 16 ]; then
            echo "::error::NEIGHBOURHOOD_ADMIN_TOKEN must be at least 16 characters."
            exit 1
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.ready.outputs.go == 'true'
      - name: Type-check
        if: steps.ready.outputs.go == 'true'
        run: npx tsc --noEmit
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        run: npx wrangler deploy
      - name: Set the admin key and the visitor salt
        if: steps.ready.outputs.go == 'true'
        run: |
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          openssl rand -hex 16 | tr -d '\n' | npx wrangler secret put VISITOR_SALT
