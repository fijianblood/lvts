<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Chef Fiji · Pretend cooking | LvTS</title>
<meta name="description" content="A free pretend-cooking game for young children in Fiji: make a fruit salad, fry an egg, toast bread, cook chicken and rice. Learn food names in English and iTaukei. Digital play only.">
<meta name="theme-color" content="#ff7a2f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%A8%E2%80%8D%F0%9F%8D%B3%3C/text%3E%3C/svg%3E">
<!--
  Little Chef Fiji: a pretend-cooking game for young children, part of
  Little Learners Fiji by LomaVata Tech Services. One self-contained file:
  no libraries, no images or fonts from the internet, nothing uploaded.
  Progress (name, stars) is saved on this device only.

  It is DIGITAL PRETEND PLAY. It never tells a child to use a real knife,
  stove, oven, toaster, hot water or any real kitchen equipment, and it asks
  a grown-up to play along. All cooking is on-screen taps and animations.

  Languages: English first. iTaukei words are shown only for foods whose
  word is already reviewed in our Noqu Vuli game (banana = jaina, mango =
  maqo, coconut = niu). Other foods show in English only until a fluent
  speaker reviews the iTaukei. Please don't add invented words here.
-->
<style>
:root{
  --orange:#ff7a2f;--orange-d:#e85d12;--mango:#ffb02e;--leaf:#36b37e;--berry:#ff4d6d;
  --sky:#5bb8ff;--cream:#fff6e9;--ink:#3b2a1e;--muted:#9a7b63;--line:#f0e2d0;
  --green:#16a34a;--yellow:#ffd23f;
  --shadow:0 8px 22px rgba(120,70,20,.16);
  font-family:"Nunito","Baloo 2",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#ffe7cf 0,#fff2e2 55%,#eafaff 100%);color:var(--ink);-webkit-tap-highlight-color:transparent;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
#app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;background:var(--cream);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px) and (min-height:720px){#app{height:min(900px,calc(100dvh - 32px));border-radius:36px;box-shadow:0 30px 80px rgba(150,90,30,.25);border:8px solid #fff}}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;font-weight:900;color:var(--orange)}
.bar .title{flex:1;text-align:center;font-weight:900;font-size:19px}
.steps{display:flex;gap:5px;justify-content:center;padding:4px 0 2px}
.steps i{width:20px;height:6px;border-radius:9px;background:#f0ddc6}
.steps i.on{background:var(--orange);width:28px}
.steps i.done{background:var(--mango)}

/* buttons */
.btn{display:block;width:100%;padding:16px;border-radius:999px;background:var(--orange);color:#fff;font-weight:900;font-size:18px;box-shadow:0 6px 0 var(--orange-d),0 12px 20px rgba(200,90,20,.28);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-d)}
.btn.light{background:#fff;color:var(--orange);box-shadow:0 6px 0 #ffd9bd}
.btn.green{background:var(--leaf);box-shadow:0 6px 0 #1f9160,0 12px 20px rgba(30,150,90,.28)}
.btn:disabled{opacity:.45;cursor:default}
.btn + .btn{margin-top:12px}

/* welcome */
.welcome{background:linear-gradient(170deg,#ff9f5a 0%,#ff7a2f 55%,#ff5d2e 100%);color:#fff;position:relative;overflow:hidden}
.welcome .scroll{display:flex;flex-direction:column;padding-top:24px;text-align:center}
.deco{position:absolute;opacity:.22;pointer-events:none;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(8deg)}}
.brand{align-self:center;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;letter-spacing:.05em}
h1.hero{font-size:46px;line-height:1.02;font-weight:900;margin-top:12px;letter-spacing:-.5px;text-shadow:0 4px 0 rgba(150,50,0,.25)}
h1.hero .y{color:#fff3c4}
.chef{font-size:112px;line-height:1;margin:10px 0 4px;display:inline-block;filter:drop-shadow(0 10px 12px rgba(120,40,0,.35));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{display:inline-block;background:#fff;color:var(--ink);border-radius:18px;padding:9px 15px;font-weight:800;font-size:15px;position:relative}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.wfield{margin-top:auto;padding-top:14px}
.wfield label{display:block;font-weight:800;font-size:14px;margin:0 0 8px;opacity:.95}
input.name{width:100%;padding:14px 18px;border-radius:16px;border:2px solid transparent;font:inherit;font-size:17px;font-weight:800;color:var(--ink);background:#fff;text-align:center}
.langrow{display:flex;gap:8px;justify-content:center;margin-top:12px}
.langbtn{background:rgba(255,255,255,.18);border-radius:999px;padding:9px 16px;font-weight:800;font-size:14px;color:#fff}
.langbtn.on{background:#fff;color:var(--orange)}
.welcome .btn{margin-top:14px;background:#fff;color:var(--orange);box-shadow:0 6px 0 #d8541a,0 12px 20px rgba(120,20,0,.28)}
.grownup{margin-top:14px;font-size:12.5px;font-weight:700;opacity:.92;line-height:1.5;background:rgba(0,0,0,.12);border-radius:14px;padding:10px 12px}

/* kitchen scene */
.kitchen{height:186px;border-radius:22px;margin:2px 2px 4px;position:relative;overflow:hidden;background:linear-gradient(#cdeafe 0 44%,#ffe6c7 44% 100%);box-shadow:var(--shadow)}
.kitchen .win{position:absolute;top:12px;left:16px;width:72px;height:50px;border-radius:8px;background:linear-gradient(#aee0ff,#d9f3ff);box-shadow:inset 0 0 0 4px #fff}
.kitchen .shelf{position:absolute;top:18px;right:10px;width:150px;height:28px;background:#caa06a;border-radius:6px;box-shadow:0 3px 0 #a67c48;display:flex;justify-content:space-around;align-items:center}
.kitchen .shelf span{font-size:22px}
.kitchen .fridge{position:absolute;left:12px;bottom:0;width:58px;height:96px;background:linear-gradient(#f3f4f6,#dfe3e8);border-radius:10px 10px 0 0;box-shadow:var(--shadow)}
.kitchen .fridge::before{content:"";position:absolute;top:44px;left:8px;right:8px;height:3px;background:#c3c8cf}
.kitchen .fridge::after{content:"🧲";position:absolute;top:10px;right:8px;font-size:13px}
.kitchen .appl{position:absolute;bottom:6px;text-align:center;font-size:30px;line-height:1}
.kitchen .appl small{display:block;font-size:8.5px;font-weight:800;color:#8a6b4f;margin-top:-2px}
.kitchen .counter-lip{position:absolute;left:0;right:0;bottom:0;height:88px;background:linear-gradient(#f0d6ac,#e7c893)}
.kitchen .counter-lip::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:#d9b483}

/* menus & cards */
h3.sec{margin:14px 4px 8px;font-size:17px;font-weight:900}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.recipe{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:14px 8px 12px;text-align:center;border:3px solid transparent;transition:transform .1s}
.recipe:active{transform:scale(.96)}
.recipe .em{font-size:44px;line-height:1.05}
.recipe .nm{font-weight:900;font-size:15px;margin-top:2px}
.recipe .vb{font-size:11px;color:#fff;font-weight:800;border-radius:999px;padding:2px 10px;display:inline-block;margin-top:4px}
.explorebtn{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:left;margin-top:12px}
.explorebtn .ic{font-size:30px}
.explorebtn b{display:block;font-size:16px;font-weight:900}
.explorebtn small{color:var(--muted);font-weight:700}
.explorebtn .arrow{margin-left:auto;color:var(--orange);font-weight:900;font-size:22px}

/* instruction line */
.say{display:flex;align-items:center;gap:10px;justify-content:center;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);margin:2px 2px 10px;text-align:center}
.say b{font-size:17px;font-weight:900}
.say .spk{width:40px;height:40px;flex:none;border-radius:50%;background:#fff6e9;display:grid;place-items:center;font-size:18px;box-shadow:inset 0 0 0 2px var(--line)}
.hint{text-align:center;color:var(--muted);font-weight:700;font-size:13px;margin:-4px 2px 10px}

/* category chips */
.cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:2px 0 12px}
.chip{background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:var(--shadow);color:var(--muted)}
.chip.on{background:var(--orange);color:#fff}

/* food grid */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.food{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px 6px 8px;text-align:center;border:3px solid transparent;transition:transform .1s,border-color .15s;position:relative}
.food:active{transform:scale(.95)}
.food.picked{border-color:var(--leaf);background:#edfcf4}
.food .em{font-size:44px;line-height:1.05;display:block}
.food .nm{font-weight:900;font-size:13.5px;margin-top:2px}
.food .fj{font-size:11px;color:var(--muted);font-weight:800}
.pickcount{text-align:center;font-weight:900;color:var(--orange);margin:12px 0 2px;font-size:15px}

/* station stage */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:6px 16px;position:relative;min-height:260px}
.items{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;max-width:360px}
.item{font-size:52px;line-height:1;position:relative;transition:transform .12s,opacity .3s;cursor:pointer}
.item:active{transform:scale(.9)}
.item .lbl{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--muted);white-space:nowrap}
.item.todo{animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{45%,55%{transform:rotate(0)}48%{transform:rotate(-7deg)}52%{transform:rotate(7deg)}}
.splash{position:absolute;font-size:28px;animation:pop .5s ease forwards;pointer-events:none;left:40%;top:-6px}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{opacity:1}100%{transform:scale(1.4) translateY(-14px);opacity:0}}

/* mixing bowl / plate */
.bowl{width:210px;height:150px;border-radius:0 0 120px 120px/0 0 150px 150px;background:linear-gradient(#fff,#ffe9d2);box-shadow:var(--shadow),inset 0 10px 0 rgba(0,0,0,.04);position:relative;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:2px;padding:10px;overflow:hidden}
.bowl::before{content:"";position:absolute;top:-10px;left:-6px;right:-6px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--shadow)}
.bowl .piece,.plate .piece{font-size:30px;line-height:1;position:relative;animation:drop .4s cubic-bezier(.3,1.4,.6,1)}
@keyframes drop{from{transform:translateY(-120px) scale(.6);opacity:0}}
.spoon{position:absolute;right:-6px;top:-22px;font-size:40px;transform-origin:bottom center;animation:stir 1.4s ease-in-out infinite}
@keyframes stir{50%{transform:rotate(-16deg) translateX(-10px)}}
.plate{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff 60%,#eef3f6 61%,#dbe4ea 100%);box-shadow:var(--shadow);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;padding:40px;position:relative}
.plate .piece{font-size:38px}
.counter{font-size:40px;font-weight:900;color:var(--orange);min-height:46px}

/* cook vessels */
.cookzone{cursor:pointer;position:relative;transition:transform .1s}
.cookzone:active{transform:scale(.97)}
.pan{width:184px;height:56px;background:linear-gradient(#4a4b52,#303036);border-radius:50%;position:relative;box-shadow:var(--shadow)}
.pan::after{content:"";position:absolute;right:-68px;top:50%;transform:translateY(-50%);width:68px;height:12px;border-radius:8px;background:#2a2a30}
.pan .food{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:50px}
.pot{width:150px;height:104px;background:linear-gradient(#55565c,#3a3a40);border-radius:14px 14px 22px 22px;position:relative;box-shadow:var(--shadow);margin-top:14px}
.pot::before{content:"";position:absolute;top:-12px;left:-12px;right:-12px;height:16px;border-radius:9px;background:#6a6b72}
.pot .food{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-size:46px}
.toaster{width:150px;height:98px;background:linear-gradient(#d3dbe3,#a6b6c3);border-radius:16px;position:relative;box-shadow:var(--shadow);margin-top:18px}
.toaster::after{content:"";position:absolute;bottom:14px;right:14px;width:14px;height:14px;border-radius:50%;background:#e85d12;box-shadow:0 0 8px rgba(232,93,18,.7)}
.toaster .slot{position:absolute;top:14px;left:22px;right:22px;height:12px;background:#2a2f36;border-radius:8px}
.toaster .food{position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-size:46px;transition:top .3s}
.toaster.done .food{top:-34px}
.sizzle{position:absolute;font-size:22px;animation:pop .6s ease forwards;pointer-events:none}
.progress{width:184px;height:14px;background:#efe0cf;border-radius:9px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--mango),var(--orange));transition:width .25s;width:0}
.spread-base{font-size:88px;position:relative;cursor:pointer}
.spread-base .butter{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;opacity:0;transition:opacity .3s}
.spread-base.on .butter{opacity:1}
.pan.flip .food,.pot.flip .food,.toaster.flip .food{animation:flipfood .6s ease}
@keyframes flipfood{0%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-44px) rotate(180deg)}100%{transform:translateX(-50%) rotate(360deg)}}
.seasonfood{position:relative;font-size:78px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.sdot{position:absolute;font-size:30px;color:#fff;-webkit-text-stroke:1px #d8c9b0;font-weight:900;animation:pop .6s ease;pointer-events:none}

/* celebrate */
.done{text-align:center;display:flex;flex-direction:column;justify-content:center;flex:1;padding:22px;position:relative;overflow:hidden}
.done .big{font-size:116px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.done h2{font-size:28px;font-weight:900;margin-top:6px}
.done p{color:var(--muted);font-weight:800;margin-top:6px}
.stars{font-size:46px;letter-spacing:6px;margin-top:10px}
.badge{display:inline-block;margin:14px auto 0;background:#fff;border-radius:20px;padding:12px 18px;font-weight:900;box-shadow:var(--shadow);color:var(--orange)}
.badge span{font-size:32px;display:block}
.confetti{position:absolute;top:-30px;font-size:22px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(900px) rotate(360deg)}}

/* bottom action bar */
.foot{padding:8px 16px calc(14px + env(safe-area-inset-bottom))}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.confetti{display:none}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<noscript><p style="padding:2rem;text-align:center">Little Chef Fiji needs JavaScript turned on.</p></noscript>
<script>
'use strict';

/* ---------------- Foods ----------------
   fj = the iTaukei word, set only for foods already reviewed in our Noqu Vuli
   game (banana, mango, coconut). Everything else shows in English until a
   fluent speaker reviews it. Some emoji are friendly stand-ins (pawpaw, roots)
   until original art is drawn. Please don't invent iTaukei words here. */
const FOODS = [
  // fruits
  {id:'banana',     en:'Banana',     e:'🍌', fj:'jaina', cat:'fruit'},
  {id:'mango',      en:'Mango',      e:'🥭', fj:'maqo',  cat:'fruit'},
  {id:'pineapple',  en:'Pineapple',  e:'🍍',             cat:'fruit'},
  {id:'watermelon', en:'Watermelon', e:'🍉',             cat:'fruit'},
  {id:'pawpaw',     en:'Pawpaw',     e:'🍈',             cat:'fruit'},
  {id:'orange',     en:'Orange',     e:'🍊',             cat:'fruit'},
  {id:'coconut',    en:'Coconut',    e:'🥥', fj:'niu',   cat:'fruit'},
  // vegetables
  {id:'carrot',     en:'Carrot',     e:'🥕',             cat:'veg'},
  {id:'tomato',     en:'Tomato',     e:'🍅',             cat:'veg'},
  {id:'cabbage',    en:'Cabbage',    e:'🥬',             cat:'veg'},
  {id:'chilli',     en:'Chilli',     e:'🌶️',             cat:'veg'},
  // grains & roots (Fiji staples)
  {id:'rice',       en:'Rice',       e:'🍚',             cat:'grain'},
  {id:'bread',      en:'Bread',      e:'🍞',             cat:'grain'},
  {id:'cassava',    en:'Cassava',    e:'🥔',             cat:'grain'},
  {id:'kumala',     en:'Kumala',     e:'🍠',             cat:'grain'},
  {id:'dalo',       en:'Taro (dalo)',e:'🟤',             cat:'grain'},
  // other pretend ingredients
  {id:'egg',        en:'Egg',        e:'🥚',             cat:'other'},
  {id:'butter',     en:'Butter',     e:'🧈',             cat:'other'},
  {id:'chicken',    en:'Chicken',    e:'🍗',             cat:'other'},
  {id:'fish',       en:'Fish',       e:'🐟',             cat:'other'},
  {id:'milk',       en:'Milk',       e:'🥛',             cat:'other'},
];
const info = id => FOODS.find(f => f.id === id) || {en:id, e:'🍽️'};
const CATS = [['fruit','Fruits','🍎'],['veg','Vegetables','🥕'],['grain','Grains','🍚'],['other','Other','🥚']];

const SALAD_FRUITS = ['banana','mango','pineapple','watermelon','pawpaw','orange','coconut'];
const TOPPINGS = [{id:'mint',en:'Mint leaf',e:'🌿'},{id:'cherry',en:'Cherry',e:'🍒'},{id:'star',en:'Star fruit',e:'⭐'}];
const NUM_EN = ['', 'one','two','three','four','five','six','seven','eight'];

/* ---------------- Recipes ----------------
   Each recipe is a list of steps. Step types: choose, wash, slice, mix, add
   (put an item in a pan/pot/toaster, maybe cracking it), cook (tap to
   fry/boil/toast/cook), spread (butter), serve. */
const RECIPES = [
  {id:'salad', name:'Fruit Salad', verb:'Make', e:'🥗', tint:'var(--leaf)', badge:'Fruit Salad Chef', steps:[
    {t:'choose', min:3, max:5},
    {t:'wash'},
    {t:'slice'},
    {t:'mix'},
    {t:'pour', vessel:'bowl', bottle:'🥛', label:'yoghurt', say:'Tap to pour a little yoghurt on top'},
    {t:'serve', vessel:'bowl', toppings:true, done:'🥗'},
  ]},
  {id:'fried-egg', name:'Fried Egg', verb:'Fry', e:'🍳', tint:'var(--mango)', badge:'Egg Chef', steps:[
    {t:'pour', vessel:'pan', bottle:'🫙', label:'oil', say:'Tap the oil to pour it in the pan'},
    {t:'add', item:'🥚', vessel:'pan', crack:true, say:'Tap the egg to crack it into the pan'},
    {t:'cook', vessel:'pan', raw:'🍳', cooked:'🍳', verb:'Fry', taps:3, sizzle:'✨', say:'Tap the pan to fry the egg'},
    {t:'flip', vessel:'pan', item:'🍳', say:'Tap the pan to flip the egg'},
    {t:'season', item:'🍳', shaker:'🧂', say:'Tap the salt to season it'},
    {t:'serve', vessel:'plate', done:'🍳', garnish:['🌿','🍅']},
  ]},
  {id:'boiled-egg', name:'Boiled Egg', verb:'Boil', e:'🥚', tint:'var(--sky)', badge:'Egg Chef', steps:[
    {t:'pour', vessel:'pot', bottle:'🚰', label:'water', say:'Tap to pour water into the pot'},
    {t:'add', item:'🥚', vessel:'pot', say:'Tap the egg to put it in the pot'},
    {t:'cook', vessel:'pot', raw:'🥚', cooked:'🥚', verb:'Boil', taps:3, sizzle:'🫧', say:'Tap the pot to boil the egg'},
    {t:'season', item:'🥚', shaker:'🧂', say:'Tap the salt to season it'},
    {t:'serve', vessel:'plate', done:'🥚', garnish:['🌿']},
  ]},
  {id:'toast', name:'Buttered Toast', verb:'Toast', e:'🍞', tint:'var(--orange)', badge:'Toast Chef', steps:[
    {t:'add', item:'🍞', vessel:'toaster', say:'Tap the bread to put it in the toaster'},
    {t:'cook', vessel:'toaster', raw:'🍞', cooked:'🍞', verb:'Toast', taps:3, sizzle:'♨️', say:'Tap the toaster to toast the bread'},
    {t:'spread', base:'🍞', item:'🧈', say:'Tap the toast to spread the butter'},
    {t:'serve', vessel:'plate', done:'🍞', extra:'🧈', garnish:['🍓','🍯']},
  ]},
  {id:'chicken', name:'Cook Chicken', verb:'Cook', e:'🍗', tint:'var(--berry)', badge:'Chicken Chef', steps:[
    {t:'season', item:'🍗', shaker:'🧂', say:'Tap the salt to season the chicken'},
    {t:'pour', vessel:'pan', bottle:'🫙', label:'oil', say:'Tap the oil to pour it in the pan'},
    {t:'add', item:'🍗', vessel:'pan', say:'Tap the chicken to put it in the pan'},
    {t:'cook', vessel:'pan', raw:'🍗', cooked:'🍗', verb:'Cook', taps:4, sizzle:'✨', say:'Tap the pan to cook the chicken'},

const KEY = 'littlechef.v1';

function load(){ try{ const r = localStorage.getItem(KEY); if(r) return {...DEFAULTS, ...JSON.parse(r)}; }catch(e){} return {...DEFAULTS}; }

/* ---------------- Helpers ---------------- */
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = n => Math.floor(Math.random()*n);
const pick = a => a[rand(a.length)];
const foodLabel = f => f.fj && S.lang==='fj' ? `${f.en} · ${f.fj}` : f.en;

/* Sound: a friendly voice and little effects */
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^en[-_](AU|NZ|GB)/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }catch(e){ voice=null; } }
if('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function say(text){
  if(!S.sound || !('speechSynthesis' in window) || !text) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); if(voice){u.voice=voice;u.lang=voice.lang;} else {u.lang='en-AU';} u.rate=0.92; u.pitch=1.12; speechSynthesis.speak(u); }catch(e){}
}
let ac=null;
function tone(freqs, step, type, vol){
  if(!S.sound) return;
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); const t0=ac.currentTime;
    freqs.forEach((f,i)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f; const s=t0+i*step;
      g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(vol,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+step+0.12);
      o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s+step+0.15); }); }catch(e){}
}
const sfxPop   = ()=> tone([520,760], 0.07,'triangle',0.12);
const sfxGood  = ()=> tone([660,880,1175],0.09,'triangle',0.14);
const sfxWin   = ()=> tone([523,659,784,1047],0.11,'triangle',0.14);
const sfxSplash= ()=> tone([300,900,500],0.05,'sine',0.1);
const sfxSizzle= ()=> tone([800,1200],0.04,'sawtooth',0.05);

function burst(el, emoji){ const s=document.createElement('span'); s.className='splash'; s.textContent=emoji; el.appendChild(s); setTimeout(()=>s.remove(),560); }

/* ---------------- Session state ---------------- */
let G = null;   // one cooking session
function startRecipe(rid){
  const r = recipeById(rid); if(!r) return;
  G = {rid, r, i:0, items:[], washed:new Set(), sliced:new Set(), mixed:[], added:false, heat:0, cooked:false, spread:false, poured:false, flipped:false, season:0, seasoned:false, topping:null};
  view='game'; render(); speakStep();
}
const step = () => G.r.steps[G.i];
function nextStep(){
  G.added=false; G.heat=0; G.cooked=false; G.spread=false; G.poured=false; G.flipped=false; G.season=0; G.seasoned=false;
  G.i++;
  if(G.i >= G.r.steps.length) return finish();
  render(); speakStep();
}
// which items a wash/slice step works on
function workItems(st){ return st.items ? st.items : G.items; }

}

function gameScreen(){
  const st = step(), r = G.r;

  }
  else if(st.t==='wash'){

    const pieces = G.mixed.map(id=>`<span class="piece">${info(id).e}</span>`).join('');

    foot = `<button class="btn green" data-act="next" ${toDrop.length>0?'disabled':''}>Put on a plate →</button>`;
  }
  else if(st.t==='add'){

      <div class="stage"><div class="cookzone" data-act="cook">${vessel}</div>

    foot = `<button class="btn green" data-act="next" ${G.poured?'':'disabled'}>Next →</button>`;
  }
  else if(st.t==='flip'){
    const vessel = vesselHtml(st.vessel, st.item, G.flipped?'flip':'');
    body = `<div class="say"><span class="spk" data-act="repeat">🔊</span><b>🔁 ${esc(st.say)}</b></div>
      <div class="stage"><div class="cookzone" data-act="flipit">${vessel}</div>
        <div style="font-weight:900;color:var(--orange)">${G.flipped?'Flipped! 🔁':'Tap the pan to flip'}</div></div>`;
    foot = `<button class="btn green" data-act="next" ${G.flipped?'':'disabled'}>Next →</button>`;

function vesselHtml(kind, inner, extra){
  const cls = extra||'';
  if(kind==='pan') return `<div class="pan ${cls}">${inner?`<span class="food">${inner}</span>`:''}</div>`;
  if(kind==='pot') return `<div class="pot ${cls}">${inner?`<span class="food">${inner}</span>`:''}</div>`;
  if(kind==='toaster') return `<div class="toaster ${cls}"><span class="slot"></span>${inner?`<span class="food">${inner}</span>`:''}</div>`;
  return inner;
}

  return `<section class="screen"><div class="done">${confetti}

/* ---------------- Render + flow ---------------- */
let view = 'welcome';
function render(){
  const screens = {welcome:welcomeScreen, kitchen:kitchenScreen, explore:exploreScreen, game:gameScreen, done:doneScreen};
  $app.innerHTML = (screens[view]||welcomeScreen)();
}
function speakStep(){
  if(view==='welcome') say("Bula! Let's cook something yummy!");
  else if(view==='kitchen') say(`Welcome to the kitchen${S.name?', '+S.name:''}! What shall we make?`);
  else if(view==='explore') say('Tap a food to hear its name.');
  else if(view==='done') say(`Great job, little chef! Your ${G.r.name.toLowerCase()} is ready.`);
  else say(stepSay());
}
function finish(){
  S.made=(S.made||0)+1; S.stars=(S.stars||0)+3; if(!S.badges.includes(G.rid)) S.badges.push(G.rid); save();
  view='done'; render(); sfxWin(); speakStep();
}

$app.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  switch(act){
    case 'welcome': view='welcome'; render(); break;
    case 'kitchen': view='kitchen'; render(); speakStep(); break;
    case 'sound': S.sound=!S.sound; save(); if(!S.sound){ try{speechSynthesis.cancel();}catch(e){} } render(); break;
    case 'lang': S.lang=v; save(); render(); break;
    case 'toKitchen': { const inp=document.getElementById('kidname'); S.name=(inp?inp.value:'').trim().slice(0,18); save(); view='kitchen'; render(); speakStep(); break; }
    case 'explore': view='explore'; render(); speakStep(); break;
    case 'cat': exploreCat=v; render(); break;
    case 'sayfood': { const f=info(v); sfxPop(); say(f.fj && S.lang==='fj' ? `${f.en}. In iTaukei, ${f.fj}.` : f.en); break; }
    case 'recipe': startRecipe(v); break;
    case 'repeat': speakStep(); break;

    case 'pickfruit': {
      const st=step(), f=info(v);
      if(G.items.includes(v)) G.items=G.items.filter(id=>id!==v);
      else if(G.items.length < st.max){ G.items.push(v); sfxPop(); say(f.fj && S.lang==='fj' ? `${f.en}. In iTaukei, ${f.fj}.` : f.en); }
      render(); break;
    }
    case 'wash': { if(!G.washed.has(v)){ G.washed.add(v); sfxSplash(); say(`Clean ${info(v).en}!`); render(); const it=$app.querySelector(`[data-act=wash][data-v="${v}"]`); if(it) burst(it,'💦'); } break; }
    case 'slice': { if(!G.sliced.has(v)){ G.sliced.add(v); sfxPop(); say(`${info(v).en}, sliced!`); render(); } break; }
    case 'mix': { if(!G.mixed.includes(v)){ G.mixed.push(v); sfxGood(); say(`${NUM_EN[G.mixed.length]||G.mixed.length}!`); render(); } break; }

    case 'additem': { if(!G.added){ G.added=true; const st=step(); if(st.crack){ sfxSplash(); say('Crack!'); } else { sfxPop(); } render(); } break; }
    case 'cook': {
      const st=step(); if(G.cooked) break;
      G.heat++; sfxSizzle();
      const zone=$app.querySelector('.cookzone'); if(zone){ burst(zone, st.sizzle||'✨'); burst(zone, st.sizzle||'✨'); }
      if(G.heat>=st.taps){ G.cooked=true; sfxGood(); say(`${st.verb}ed! Yum!`); }
      render(); break;
    }
    case 'spread': { if(!G.spread){ G.spread=true; sfxPop(); say('Spread the butter!'); render(); } break; }
    case 'pourit': { if(!G.poured){ G.poured=true; sfxSplash(); say('Pour!'); render(); const z=$app.querySelector('.cookzone'); if(z){ burst(z,'💧'); } } break; }
    case 'flipit': { if(!G.flipped){ G.flipped=true; sfxPop(); say('Flip!'); render(); } break; }
    case 'seasonit': { if(!G.seasoned){ G.season++; sfxSizzle(); say('Sprinkle!'); if(G.season>=2){ G.seasoned=true; sfxGood(); } render(); } break; }
    case 'top': { G.topping=v; sfxPop(); say(TOPPINGS.find(t=>t.id===v).en); render(); break; }
    case 'garnish': { G.topping=v; sfxPop(); say('Garnish!'); render(); break; }

    case 'next': nextStep(); break;
    case 'finish': finish(); break;
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='kidname'){ const b=$app.querySelector('[data-act=toKitchen]'); if(b) b.click(); } });

render();
</script>
</body>
</html>
